<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8" />
	<title>Convertigo - Project</title>
	<link href="favicon.ico" rel="shortcut icon" type="image/x-icon">
	<script type="text/javascript">
		// The test page of a project, project.html#<project>[?...], now lives in the dashboard.
		// The project name is read as before: the [a-zA-Z0-9_] characters after the hash.
		// launch=webapp, which opened the mobile application, now opens the frontend of the project.
		(function () {
			var match = window.location.href.match(/.*#([a-zA-Z0-9_]*)\??(.*)/);
			var project = match ? match[1] : "";
			var page = /(^|&)launch=webapp(&|$)/.test(match ? match[2] : "") ? "/frontend/" : "/backend/";
			window.location.replace(project ? "dashboard/" + encodeURIComponent(project) + page : "dashboard/");
		})();
	</script>
</head>

<body>
	<noscript><a href="dashboard/">Open the Convertigo dashboard</a></noscript>
</body>

</html>
