display_name=Sequence
short_description=Defines a sequence.
property.includeResponseElement.display_name=Include response element
property.includeResponseElement.short_description=Defines whether the response element should be included in web service result or whether the data should be directly under the public method response node (i.e. allows to remove the encompassing 'response' node or not)
property.autoStart.display_name=Auto start
property.autoStart.short_description=Defines whether the sequence is automatically executed after project deployment and at engine start
property.jsonNativeOutput.display_name=JSON native output
property.jsonNativeOutput.short_description=Defines whether, when the sequence is requested as JSON (.json), its output JSON to XML steps placed directly under the sequence send their JSON as is, without building their XML. Other steps cannot use them as source, and the sequence XML output does not contain them. The project must output JSON with types and the document child nodes as root (the default).

