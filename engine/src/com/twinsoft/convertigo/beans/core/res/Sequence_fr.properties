property.jsonNativeOutput.display_name=Sortie JSON native
property.jsonNativeOutput.short_description=Indique si, quand la séquence est demandée en JSON (.json), ses étapes JSON to XML de sortie placées directement sous la séquence envoient leur JSON tel quel, sans construire leur XML. Les autres étapes ne peuvent pas les utiliser comme source, et la sortie XML de la séquence ne les contient pas. Le projet doit sortir du JSON typé avec les nœuds enfants du document comme racine (le défaut). Dans le Studio, une telle séquence s'exécute en JSON, comme les clients la demandent.
property.nativeExecution.display_name=Exécution native
property.nativeExecution.short_description=Indique si la séquence est une séquence native, à laquelle s'appliquent les chemins rapides optionnels du moteur (javascript.shared_scope : son JavaScript s'exécute dans un scope léger au-dessus d'un scope scellé unique des objets standard, que ses scripts ne peuvent pas modifier). Dans le Studio, une séquence native s'exécute en JSON et montre le JSON de chacune de ses étapes natives.
