display_name=Distinct rows
short_description=Keeps the first row of each distinct combination of the values of some columns, in one execution for the whole array. | <p>Without columns, the rows are kept as they are.</p>
property.rows.display_name=Rows
property.rows.short_description=JavaScript expression giving the array of rows the step reads (a variable of the sequence, JSON.parse of a text...).
property.variableName.display_name=Variable name
property.variableName.short_description=Name of the sequence variable that receives the array built by the step.
property.columns.display_name=Columns
property.columns.short_description=JavaScript expression giving the names of the columns whose values make a row distinct, or null.
property.valueKey.display_name=Value key
property.valueKey.short_description=Key of the value inside a cell; empty when the row holds the values themselves.
