display_name=Dédoublonner les lignes
short_description=Garde la première ligne de chaque combinaison distincte des valeurs de certaines colonnes, en une seule exécution pour tout le tableau. | <p>Sans colonnes, les lignes sont gardées telles quelles.</p>
property.rows.display_name=Lignes
property.rows.short_description=Expression JavaScript qui donne le tableau des lignes lues par l'étape (une variable de la séquence, le JSON.parse d'un texte...).
property.variableName.display_name=Nom de la variable
property.variableName.short_description=Nom de la variable de la séquence qui reçoit le tableau construit par l'étape.
property.columns.display_name=Colonnes
property.columns.short_description=Expression JavaScript qui donne les noms des colonnes dont les valeurs rendent une ligne distincte, ou null.
property.valueKey.display_name=Clé de la valeur
property.valueKey.short_description=Clé de la valeur dans une cellule ; vide quand la ligne contient directement les valeurs.
