display_name=Format cells
short_description=Formats every value of every row by the type of its column, in one execution for the whole array. | <p>Each value becomes a cell holding its value and its HTML, as the <i>format</i> builds it from the column described in the <i>schema</i>. With <i>values only</i>, a cell keeps its value without its HTML and the options of its column are put once in the <i>fields variable</i>.</p>
property.rows.display_name=Rows
property.rows.short_description=JavaScript expression giving the array of rows the step reads (a variable of the sequence, JSON.parse of a text...).
property.variableName.display_name=Variable name
property.variableName.short_description=Name of the sequence variable that receives the array built by the step.
property.format.display_name=Format
property.format.short_description=Name of the cell format: <code>baserow</code> builds the cells of a C8oForms data grid from Baserow values.
property.schema.display_name=Schema
property.schema.short_description=JavaScript expression giving the columns: an array of objects with a <code>name</code> and the options of the column (type, decimals, date format...).
property.columns.display_name=Columns
property.columns.short_description=JavaScript expression giving the names of the columns formatted with their schema, or null for all of them. The other columns are formatted without schema.
property.hiddenColumns.display_name=Hidden columns
property.hiddenColumns.short_description=JavaScript expression giving the names of the columns whose cells are marked hidden.
property.valuesOnly.display_name=Values only
property.valuesOnly.short_description=JavaScript expression: true to keep the values without their HTML.
property.defaultTimezone.display_name=Default time zone
property.defaultTimezone.short_description=JavaScript expression giving the time zone of the dates whose column has none.
property.fieldsVariableName.display_name=Fields variable name
property.fieldsVariableName.short_description=Name of the sequence variable that receives the options of the columns, with values only.
