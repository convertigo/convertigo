display_name=Formater les cellules
short_description=Formate chaque valeur de chaque ligne selon le type de sa colonne, en une seule exécution pour tout le tableau. | <p>Chaque valeur devient une cellule qui garde sa valeur et son HTML, tel que le <i>format</i> le construit à partir de la colonne décrite dans le <i>schéma</i>. Avec <i>valeurs seules</i>, une cellule garde sa valeur sans son HTML et les options de sa colonne sont mises une seule fois dans la <i>variable des champs</i>.</p>
property.rows.display_name=Lignes
property.rows.short_description=Expression JavaScript qui donne le tableau des lignes lues par l'étape (une variable de la séquence, le JSON.parse d'un texte...).
property.variableName.display_name=Nom de la variable
property.variableName.short_description=Nom de la variable de la séquence qui reçoit le tableau construit par l'étape.
property.format.display_name=Format
property.format.short_description=Nom du format des cellules : <code>baserow</code> construit les cellules d'une grille de données C8oForms à partir des valeurs Baserow.
property.schema.display_name=Schéma
property.schema.short_description=Expression JavaScript qui donne les colonnes : un tableau d'objets avec un <code>name</code> et les options de la colonne (type, décimales, format de date...).
property.columns.display_name=Colonnes
property.columns.short_description=Expression JavaScript qui donne les noms des colonnes formatées avec leur schéma, ou null pour toutes. Les autres colonnes sont formatées sans schéma.
property.hiddenColumns.display_name=Colonnes masquées
property.hiddenColumns.short_description=Expression JavaScript qui donne les noms des colonnes dont les cellules sont marquées masquées.
property.valuesOnly.display_name=Valeurs seules
property.valuesOnly.short_description=Expression JavaScript : true pour garder les valeurs sans leur HTML.
property.defaultTimezone.display_name=Fuseau horaire par défaut
property.defaultTimezone.short_description=Expression JavaScript qui donne le fuseau horaire des dates dont la colonne n'en a pas.
property.fieldsVariableName.display_name=Nom de la variable des champs
property.fieldsVariableName.short_description=Nom de la variable de la séquence qui reçoit les options des colonnes, avec valeurs seules.
