display_name=Group and aggregate
short_description=Groups the rows by the values of some columns and aggregates each group, in one execution for the whole array. | <p>One row per group: the first row of the group with an aggregate cell per aggregation (count, sum, avg, min, max), in the order of the first rows. An aggregation its column cannot take gives no rows and its message in the <i>error variable</i>.</p>
property.rows.display_name=Rows
property.rows.short_description=JavaScript expression giving the array of rows the step reads (a variable of the sequence, JSON.parse of a text...).
property.variableName.display_name=Variable name
property.variableName.short_description=Name of the sequence variable that receives the array built by the step.
property.format.display_name=Format
property.format.short_description=Name of the cell format of the aggregates: <code>baserow</code>.
property.groupColumns.display_name=Group columns
property.groupColumns.short_description=JavaScript expression giving the names of the columns the rows are grouped by, or null to keep the rows.
property.aggregations.display_name=Aggregations
property.aggregations.short_description=JavaScript expression giving the aggregations: an array of objects {type, column, key, label}.
property.schema.display_name=Schema
property.schema.short_description=JavaScript expression giving the columns, to check the aggregations and to round the sums and averages.
property.valueKey.display_name=Value key
property.valueKey.short_description=Key of the value inside a cell; empty when the row holds the values themselves.
property.errorVariableName.display_name=Error variable name
property.errorVariableName.short_description=Name of the sequence variable that receives the message of an invalid aggregation, or null.
