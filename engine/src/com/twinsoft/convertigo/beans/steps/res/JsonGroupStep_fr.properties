display_name=Regrouper et agréger
short_description=Regroupe les lignes selon les valeurs de certaines colonnes et agrège chaque groupe, en une seule exécution pour tout le tableau. | <p>Une ligne par groupe : la première ligne du groupe, avec une cellule d'agrégat par agrégation (count, sum, avg, min, max), dans l'ordre des premières lignes. Une agrégation que sa colonne ne permet pas ne donne aucune ligne et son message dans la <i>variable d'erreur</i>.</p>
property.rows.display_name=Lignes
property.rows.short_description=Expression JavaScript qui donne le tableau des lignes lues par l'étape (une variable de la séquence, le JSON.parse d'un texte...).
property.variableName.display_name=Nom de la variable
property.variableName.short_description=Nom de la variable de la séquence qui reçoit le tableau construit par l'étape.
property.format.display_name=Format
property.format.short_description=Nom du format des cellules d'agrégat : <code>baserow</code>.
property.groupColumns.display_name=Colonnes de regroupement
property.groupColumns.short_description=Expression JavaScript qui donne les noms des colonnes selon lesquelles les lignes sont regroupées, ou null pour garder les lignes.
property.aggregations.display_name=Agrégations
property.aggregations.short_description=Expression JavaScript qui donne les agrégations : un tableau d'objets {type, column, key, label}.
property.schema.display_name=Schéma
property.schema.short_description=Expression JavaScript qui donne les colonnes, pour contrôler les agrégations et arrondir les sommes et les moyennes.
property.valueKey.display_name=Clé de la valeur
property.valueKey.short_description=Clé de la valeur dans une cellule ; vide quand la ligne contient directement les valeurs.
property.errorVariableName.display_name=Nom de la variable d'erreur
property.errorVariableName.short_description=Nom de la variable de la séquence qui reçoit le message d'une agrégation invalide, ou null.
