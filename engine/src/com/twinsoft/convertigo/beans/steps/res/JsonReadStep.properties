display_name=Read JSON value
short_description=Reads the value at a JSON path in a JSON text (the raw answer of a transaction...) or in JSON data, in one execution. | <p>A text is read in stream: only the value at the <i>path</i> is built, as <code>JSON.parse</code> would build it, and the rest of the text is skipped. A path with a wildcard reads the whole text.</p><p>Paths: <code>$</code> for the value itself, then <code>.key</code>, <code>['key']</code>, <code>[index]</code>, <code>.*</code> and <code>[*]</code> (the array of the values found).</p>
property.json.display_name=JSON
property.json.short_description=JavaScript expression giving the JSON text, or the JSON data, the step reads.
property.path.display_name=Path
property.path.short_description=JSON path of the value read, <code>$</code> for the whole value (for example <code>$.results</code>, <code>$.results[0].id</code>, <code>$.results[*].id</code>).
property.defaultValue.display_name=Default value
property.defaultValue.short_description=JavaScript expression giving the value when the path selects nothing; empty for null.
property.variableName.display_name=Variable name
property.variableName.short_description=Name of the sequence variable that receives the value read.
