display_name=Lire une valeur JSON
short_description=Lit la valeur à un chemin JSON dans un texte JSON (la réponse brute d'une transaction...) ou dans des données JSON, en une seule exécution. | <p>Un texte est lu en flux : seule la valeur au <i>chemin</i> est construite, comme <code>JSON.parse</code> la construirait, et le reste du texte est sauté. Un chemin avec un joker lit tout le texte.</p><p>Chemins : <code>$</code> pour la valeur elle-même, puis <code>.clé</code>, <code>['clé']</code>, <code>[indice]</code>, <code>.*</code> et <code>[*]</code> (le tableau des valeurs trouvées).</p>
property.json.display_name=JSON
property.json.short_description=Expression JavaScript qui donne le texte JSON, ou les données JSON, que l'étape lit.
property.path.display_name=Chemin
property.path.short_description=Chemin JSON de la valeur lue, <code>$</code> pour toute la valeur (par exemple <code>$.results</code>, <code>$.results[0].id</code>, <code>$.results[*].id</code>).
property.defaultValue.display_name=Valeur par défaut
property.defaultValue.short_description=Expression JavaScript qui donne la valeur quand le chemin ne trouve rien ; vide pour null.
property.variableName.display_name=Nom de la variable
property.variableName.short_description=Nom de la variable de la séquence qui reçoit la valeur lue.
