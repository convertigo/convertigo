display_name=Select columns
short_description=Keeps and orders the columns of every row, in one execution for the whole array. | <p>The <i>first columns</i> come first, then the listed <i>columns</i>; without a list, the columns in the given <i>order</i> followed by all the others.</p>
property.rows.display_name=Rows
property.rows.short_description=JavaScript expression giving the array of rows the step reads (a variable of the sequence, JSON.parse of a text...).
property.variableName.display_name=Variable name
property.variableName.short_description=Name of the sequence variable that receives the array built by the step.
property.firstColumns.display_name=First columns
property.firstColumns.short_description=JavaScript expression giving the names of the columns put first.
property.columns.display_name=Columns
property.columns.short_description=JavaScript expression giving the names of the columns kept, in their order, or null to keep them all.
property.columnsOrder.display_name=Columns order
property.columnsOrder.short_description=JavaScript expression giving the order of the columns when all are kept.
