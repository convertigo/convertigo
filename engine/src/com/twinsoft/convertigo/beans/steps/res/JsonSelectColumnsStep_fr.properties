display_name=Sélectionner les colonnes
short_description=Garde et ordonne les colonnes de chaque ligne, en une seule exécution pour tout le tableau. | <p>Les <i>premières colonnes</i> viennent d'abord, puis les <i>colonnes</i> listées ; sans liste, les colonnes dans l'<i>ordre</i> donné suivies de toutes les autres.</p>
property.rows.display_name=Lignes
property.rows.short_description=Expression JavaScript qui donne le tableau des lignes lues par l'étape (une variable de la séquence, le JSON.parse d'un texte...).
property.variableName.display_name=Nom de la variable
property.variableName.short_description=Nom de la variable de la séquence qui reçoit le tableau construit par l'étape.
property.firstColumns.display_name=Premières colonnes
property.firstColumns.short_description=Expression JavaScript qui donne les noms des colonnes mises en tête.
property.columns.display_name=Colonnes
property.columns.short_description=Expression JavaScript qui donne les noms des colonnes gardées, dans leur ordre, ou null pour les garder toutes.
property.columnsOrder.display_name=Ordre des colonnes
property.columnsOrder.short_description=Expression JavaScript qui donne l'ordre des colonnes quand elles sont toutes gardées.
