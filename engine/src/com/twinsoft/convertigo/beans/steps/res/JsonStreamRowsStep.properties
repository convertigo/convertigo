display_name=Write rows in stream
short_description=Reads the rows of a Baserow table page after page and writes each one formatted, deduplicated and with its columns selected, in one pass, without keeping them. | <p>Format cells, Distinct rows and Select columns fused for a stream: the memory does not depend on the number of rows. Without stream mode, a JSON to XML step.</p>
property.streamMode.display_name=Stream mode
property.streamMode.short_description=JavaScript expression: true to read and write the rows in stream; false to output the JSON object like a JSON to XML step.
property.rows.display_name=Rows
property.rows.short_description=JavaScript expression giving the rows of the first page, already read by the sequence.
property.firstPage.display_name=First page
property.firstPage.short_description=JavaScript expression giving the number of the first page.
property.nextUrl.display_name=Next URL
property.nextUrl.short_description=JavaScript expression giving the next URL Baserow returned with the first page, or null.
property.baseUrl.display_name=Base URL
property.baseUrl.short_description=JavaScript expression giving the scheme, server and port the next pages are read from (their path and query come from the next URL).
property.authorization.display_name=Authorization
property.authorization.short_description=JavaScript expression giving the Authorization header of the requests of the next pages.
property.maxRows.display_name=Maximum rows
property.maxRows.short_description=JavaScript expression giving the maximum number of rows read.
property.schema.display_name=Schema
property.schema.short_description=JavaScript expression giving the columns (fields of the table).
property.columns.display_name=Columns
property.columns.short_description=JavaScript expression giving the names of the columns formatted with their schema, or null for all of them.
property.hiddenColumns.display_name=Hidden columns
property.hiddenColumns.short_description=JavaScript expression giving the names of the columns whose cells are marked hidden.
property.valuesOnly.display_name=Values only
property.valuesOnly.short_description=JavaScript expression: true to keep the values without their HTML (the rows then go through a spool, the options of the columns being answered before them).
property.defaultTimezone.display_name=Default time zone
property.defaultTimezone.short_description=JavaScript expression giving the time zone of the dates whose column has none.
property.distinctColumns.display_name=Distinct columns
property.distinctColumns.short_description=JavaScript expression giving the columns whose values make a row distinct, or null.
property.firstColumns.display_name=First columns
property.firstColumns.short_description=JavaScript expression giving the names of the columns put first.
property.outputColumns.display_name=Output columns
property.outputColumns.short_description=JavaScript expression giving the names of the columns kept, in their order, or null to keep them all.
property.columnsOrder.display_name=Columns order
property.columnsOrder.short_description=JavaScript expression giving the order of the columns when all are kept.
property.failPage.display_name=Failing page
property.failPage.short_description=Test only: JavaScript expression giving a page number whose reading fails.
property.fieldsVariableName.display_name=Fields variable name
property.fieldsVariableName.short_description=Name of the sequence variable that receives the options of the columns, with values only.
property.errorVariableName.display_name=Error variable name
property.errorVariableName.short_description=Name of the sequence variable that receives the error of Baserow when the rows are read during the sequence.
