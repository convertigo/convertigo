display_name=Écrire les lignes en flux
short_description=Lit les lignes d'une table Baserow page après page et écrit chacune formatée, dédoublonnée et avec ses colonnes sélectionnées, en une seule passe, sans les garder. | <p>Formater les cellules, Dédoublonner et Sélectionner les colonnes fusionnés pour un flux : la mémoire ne dépend pas du nombre de lignes. Sans mode flux, une étape JSON to XML.</p>
property.streamMode.display_name=Mode flux
property.streamMode.short_description=Expression JavaScript : true pour lire et écrire les lignes en flux ; false pour sortir l'objet JSON comme une étape JSON to XML.
property.rows.display_name=Lignes
property.rows.short_description=Expression JavaScript qui donne les lignes de la première page, déjà lue par la séquence.
property.firstPage.display_name=Première page
property.firstPage.short_description=Expression JavaScript qui donne le numéro de la première page.
property.nextUrl.display_name=URL suivante
property.nextUrl.short_description=Expression JavaScript qui donne l'URL suivante rendue par Baserow avec la première page, ou null.
property.baseUrl.display_name=URL de base
property.baseUrl.short_description=Expression JavaScript qui donne le schéma, le serveur et le port d'où les pages suivantes sont lues (leur chemin et leurs paramètres viennent de l'URL suivante).
property.authorization.display_name=Autorisation
property.authorization.short_description=Expression JavaScript qui donne l'en-tête Authorization des requêtes des pages suivantes.
property.maxRows.display_name=Nombre maximal de lignes
property.maxRows.short_description=Expression JavaScript qui donne le nombre maximal de lignes lues.
property.schema.display_name=Schéma
property.schema.short_description=Expression JavaScript qui donne les colonnes (champs de la table).
property.columns.display_name=Colonnes
property.columns.short_description=Expression JavaScript qui donne les noms des colonnes formatées avec leur schéma, ou null pour toutes.
property.hiddenColumns.display_name=Colonnes masquées
property.hiddenColumns.short_description=Expression JavaScript qui donne les noms des colonnes dont les cellules sont marquées masquées.
property.valuesOnly.display_name=Valeurs seules
property.valuesOnly.short_description=Expression JavaScript : true pour garder les valeurs sans leur HTML (les lignes passent alors par un tampon, les options des colonnes étant rendues avant elles).
property.defaultTimezone.display_name=Fuseau horaire par défaut
property.defaultTimezone.short_description=Expression JavaScript qui donne le fuseau horaire des dates dont la colonne n'en a pas.
property.distinctColumns.display_name=Colonnes distinctes
property.distinctColumns.short_description=Expression JavaScript qui donne les colonnes dont les valeurs rendent une ligne distincte, ou null.
property.firstColumns.display_name=Premières colonnes
property.firstColumns.short_description=Expression JavaScript qui donne les noms des colonnes mises en tête.
property.outputColumns.display_name=Colonnes de sortie
property.outputColumns.short_description=Expression JavaScript qui donne les noms des colonnes gardées, dans leur ordre, ou null pour les garder toutes.
property.columnsOrder.display_name=Ordre des colonnes
property.columnsOrder.short_description=Expression JavaScript qui donne l'ordre des colonnes quand elles sont toutes gardées.
property.failPage.display_name=Page en échec
property.failPage.short_description=Pour les tests seulement : expression JavaScript qui donne un numéro de page dont la lecture échoue.
property.fieldsVariableName.display_name=Nom de la variable des champs
property.fieldsVariableName.short_description=Nom de la variable de la séquence qui reçoit les options des colonnes, avec valeurs seules.
property.errorVariableName.display_name=Nom de la variable d'erreur
property.errorVariableName.short_description=Nom de la variable de la séquence qui reçoit l'erreur de Baserow quand les lignes sont lues pendant la séquence.
property.restartPageSize.display_name=Taille de page à la reprise
property.restartPageSize.short_description=Expression JavaScript qui donne la taille de page avec laquelle le flux relit depuis la première page, quand la séquence n'a lu qu'une première page d'une ligne ; vide pour continuer après la première page.
