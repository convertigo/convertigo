# Disposable test only. Do not use these credentials or timings in production.
port 26379
bind 0.0.0.0
protected-mode no
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel monitor c8o-test redis-master 6379 2
sentinel auth-pass c8o-test data-test-password
sentinel down-after-milliseconds c8o-test 2000
sentinel failover-timeout c8o-test 10000
sentinel parallel-syncs c8o-test 1
requirepass sentinel-test-password
