// Engine test source set and verification tasks.

tasks.register('timingTraceTest', JavaExec) {
	group = 'verification'
	description = 'Request timing, nested thread allocations and actual XML construction diagnostics.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'org.junit.runner.JUnitCore'
	args 'com.twinsoft.convertigo.engine.util.TimingTraceTest'
}

sourceSets {
	test {
		java.srcDirs = ['test']
		resources.srcDirs = ['test-resources']
	}
}

dependencies {
	testImplementation 'junit:junit:4.13.2'
}

tasks.register('sessionSerializationTest', JavaExec) {
	group = 'verification'
	description = 'Round-trip regression tests for Redis session values (no Redis server required).'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.twinsoft.convertigo.engine.sessions.SessionSerializationTest'
}

tasks.named('check') {
	dependsOn 'timingTraceTest'
	dependsOn 'sessionSerializationTest'
	dependsOn 'requestScopedSessionTest'
	dependsOn 'componentRefManagerTest'
	dependsOn 'projectArchiveTest'
	dependsOn 'ionBeanTest'
	dependsOn 'mdcLifecycleTest'
	dependsOn 'workspaceLoadingTest'
	dependsOn 'fullSyncReplicationPolicyTest'
	dependsOn 'stepSourceTest'
	dependsOn 'studioSearchTest'
	dependsOn 'tagTest'
	dependsOn 'localWorkDirectoryTest'
	dependsOn 'projectLibrariesTest'
	dependsOn 'applicationBuildsTest'
	dependsOn 'flowPackagesTest'
	dependsOn 'flowEngineSymbolsTest'
	dependsOn 'optionalDefaultsTest'
	dependsOn 'adminInstanceRoutingTest'
	dependsOn 'designDocumentReduceTest'
	dependsOn 'redisSentinelConfigurationTest'
	dependsOn 'staticCacheControlTest'
	dependsOn 'adminCacheControlTest'
	dependsOn 'invalidRequestSessionTest'
	dependsOn 'ngxBuildSettingsTest'
	dependsOn 'attachmentStreamingTest'
}

