// Engine test source sets, verification tasks and Eclipse test classpath integration.

sourceSets {
	sessionTest {
		java.srcDirs = ['test']
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + compileClasspath
	}
	componentRefTest {
		java.srcDirs = ['test']
		java.include 'com/twinsoft/convertigo/engine/mobile/**'
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + compileClasspath
	}
}

eclipse {
	classpath.file.whenMerged { cp ->
		// sessionTest and componentRefTest share the 'test' source directory: JDT rejects
		// duplicate source entries, and the sessionTest entry already covers the whole directory.
		cp.entries.removeAll { it.kind == 'src' && it.path == 'test' && it.output == 'bin/componentRefTest' }
	}
}

tasks.register('sessionSerializationTest', JavaExec) {
	group = 'verification'
	description = 'Round-trip regression tests for Redis session values (no Redis server required).'
	dependsOn sessionTestClasses
	classpath = sourceSets.sessionTest.runtimeClasspath
	mainClass = 'com.twinsoft.convertigo.engine.sessions.SessionSerializationTest'
}

tasks.named('check') {
	dependsOn 'sessionSerializationTest'
	dependsOn 'requestScopedSessionTest'
	dependsOn 'componentRefManagerTest'
	dependsOn 'projectArchiveTest'
	dependsOn 'ionBeanTest'
	dependsOn 'mdcLifecycleTest'
	dependsOn 'workspaceLoadingTest'
	dependsOn 'fullSyncReplicationPolicyTest'
	dependsOn 'stepSourceTest'
}

