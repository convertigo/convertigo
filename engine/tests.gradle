// Engine test source set and verification tasks.

sourceSets {
	test {
		java.srcDirs = ['test']
		resources.srcDirs = ['test-resources']
	}
}

dependencies {
	testImplementation 'junit:junit:4.13.2'
}

tasks.register('sessionSerializationTest', JavaExec) {
	group = 'verification'
	description = 'Round-trip regression tests for Redis session values (no Redis server required).'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.twinsoft.convertigo.engine.sessions.SessionSerializationTest'
}

tasks.named('check') {
	dependsOn 'sessionSerializationTest'
	dependsOn 'requestScopedSessionTest'
	dependsOn 'componentRefManagerTest'
	dependsOn 'projectArchiveTest'
	dependsOn 'ionBeanTest'
	dependsOn 'mdcLifecycleTest'
	dependsOn 'workspaceLoadingTest'
	dependsOn 'fullSyncReplicationPolicyTest'
	dependsOn 'stepSourceTest'
	dependsOn 'studioSearchTest'
	dependsOn 'tagTest'
	dependsOn 'localWorkDirectoryTest'
	dependsOn 'projectLibrariesTest'
	dependsOn 'applicationBuildsTest'
}

tasks.register('stepSourceTest', JavaExec) {
	group = 'verification'
	description = 'Regression tests for step source aggregation and broken-source labels.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'org.junit.runner.JUnitCore'
	args 'com.twinsoft.convertigo.beans.core.StepSourceTest'
}

tasks.register('studioSearchTest', JavaExec) {
	group = 'verification'
	description = 'Regression tests for Studio object search criteria and shared filters.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'org.junit.runner.JUnitCore'
	args 'com.twinsoft.convertigo.engine.admin.services.studio.treeview.SearchTest'
}

tasks.register('fullSyncReplicationPolicyTest', JavaExec) {
	group = 'verification'
	description = 'Regression tests for FullSync replication access and shared database restrictions.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'org.junit.runner.JUnitCore'
	args 'com.twinsoft.convertigo.engine.servlets.FullSyncReplicationPolicyTest'
}

tasks.register('workspaceLoadingTest', JavaExec) {
	group = 'verification'
	description = 'Regression tests for project loading and archive metadata.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'org.junit.runner.JUnitCore'
	args 'com.twinsoft.convertigo.engine.util.ZipUtilsTest',
		'com.twinsoft.convertigo.engine.util.YamlConverterTest',
		'com.twinsoft.convertigo.engine.ReferencedProjectManagerTest'
}

tasks.register('mdcLifecycleTest', JavaExec) {
	group = 'verification'
	description = 'Regression tests for MDC isolation across requests and asynchronous tasks.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'org.junit.runner.JUnitCore'
	args 'com.twinsoft.convertigo.engine.MdcLifecycleTest'
}

tasks.register('requestScopedSessionTest', JavaExec) {
	group = 'verification'
	description = 'Regression tests for the ephemeral request-scoped session of terminating URL mapper operations.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'org.junit.runner.JUnitCore'
	args 'com.twinsoft.convertigo.engine.sessions.RequestScopedHttpSessionTest',
		'com.twinsoft.convertigo.engine.servlets.RestApiServletSessionModeTest'
}

tasks.register('projectArchiveTest', JavaExec) {
	group = 'verification'
	description = 'Regression tests for workspace project archive cleanup.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.twinsoft.convertigo.engine.ProjectArchiveTest'
}

tasks.register('ionBeanTest', JavaExec) {
	group = 'verification'
	description = 'Regression tests for ion bean instances sharing their template model.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.twinsoft.convertigo.beans.ngx.components.dynamic.IonBeanTest'
}

tasks.register('componentRefManagerTest', JavaExec) {
	group = 'verification'
	description = 'Regression tests for shared component and action dependency tracking.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.twinsoft.convertigo.engine.mobile.ComponentRefManagerTest'
}

tasks.register('soapuiSmokeTest', JavaExec) {
	group = 'verification'
	description = 'Runs a minimal SoapUI initialization to validate the light dependencies.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.twinsoft.convertigo.engine.util.SoapUiSmokeTest'
	dependsOn tasks.named('classes')
	dependsOn rootProject.tasks.named('publishSoapuiLightPublicationToMavenLocal')
}

tasks.register('tagTest', JavaExec) {
	group = 'verification'
	description = 'Regression tests for shared project and workspace tag editing, lifecycle and persistence.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'org.junit.runner.JUnitCore'
	args 'com.twinsoft.convertigo.engine.tags.TagManagerTest', 'com.twinsoft.convertigo.engine.tags.TagPasteAdapterTest'
}

tasks.register('localWorkDirectoryTest', JavaExec) {
	group = 'verification'
	description = 'Regression tests for the local working directory: links, reuse, version and startup cleanup.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'org.junit.runner.JUnitCore'
	args 'com.twinsoft.convertigo.engine.LocalWorkDirectoryTest'
}

tasks.register('projectLibrariesTest', JavaExec) {
	group = 'verification'
	description = 'Regression tests for the class paths of the projects: generations, protected packages, JDBC drivers and retirement.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'org.junit.runner.JUnitCore'
	args 'com.twinsoft.convertigo.engine.ProjectLibrariesTest'
}

tasks.register('applicationBuildsTest', JavaExec) {
	group = 'verification'
	description = 'Regression tests for the builds of the applications by a server: lock between instances and publication.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'org.junit.runner.JUnitCore'
	args 'com.twinsoft.convertigo.engine.ApplicationBuildsTest'
}
