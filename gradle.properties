org.gradle.caching=true
org.gradle.configureondemand=true
#org.gradle.logging.level=INFO
org.gradle.parallel=true

# Dev Studio in Eclipse (generateEclipseConfigurationWithManifest, setupStudioDev).
# By default the providers (couchdb, sap, plugins) are used as jars. To debug a provider, link its
# local checkout as sources in the engine and studio Eclipse projects, then regenerate and refresh:
#   c8o.localProviders     'all', or a comma-separated list of couchdb, sap, plugins (empty: jars)
#   c8o.localProvidersDir  folder holding the convertigo-provider-<name> checkouts
#                          (default: the parent folder of this checkout)
# Set them for one run with -P (-Pc8o.localProviders= forces the jars), or per checkout in
# local.properties (ignored by git, same key=value format), which overrides the gradle.properties
# files. For example:
#c8o.localProviders=couchdb,sap
#c8o.localProvidersDir=~/git/providers-8.4
